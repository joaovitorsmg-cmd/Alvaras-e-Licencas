<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Licenças e Alvarás · Agroquima</title>
<style>
:root{
  --azul-royal:#0D47A1; --azul-escuro:#002B5B; --azul-claro:#64B5F6;
  --preto:#000000; --cinza-escuro:#333333; --cinza-claro:#E6E6E6;

  --cor-vencido:#C62828;      --cor-vencido-bg:#FDECEA;
  --cor-nao-iniciado:#6B1E3C; --cor-nao-iniciado-bg:#F7E8EE;
  --cor-rejeitado:#6A1B9A;    --cor-rejeitado-bg:#F1E7F8;
  --cor-aguardando:#EF6C00;   --cor-aguardando-bg:#FEF1E3;
  --cor-pendente:#F9A825;     --cor-pendente-bg:#FFF8E1;
  --cor-atencao:#1565C0;      --cor-atencao-bg:#E7F1FC;
  --cor-ok:#2E7D32;           --cor-ok-bg:#EAF4E9;
  --cor-permanente:#607D8B;   --cor-permanente-bg:#EBEFF1;

  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F0F3F7;
  --border:#DDE3EA; --text:#1A1F27; --text-muted:#5B6472;
  --header-bg:var(--azul-royal); --header-text:#FFFFFF;
  --shadow:0 1px 3px rgba(20,30,50,.08), 0 1px 2px rgba(20,30,50,.06);
  --shadow-lg:0 12px 32px rgba(10,20,40,.18);
  --radius:12px; --radius-sm:8px;
  --font-display:'Arial Black', Arial, sans-serif;
  --font-body:Arial, Helvetica, sans-serif;
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#04122A; --surface:#0B2B54; --surface-2:#0E3364;
  --border:#1B4276; --text:#EAF1FB; --text-muted:#9FB6D6;
  --header-bg:var(--azul-escuro); --header-text:#FFFFFF;
  --shadow:0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --cor-vencido-bg:#3A1518; --cor-nao-iniciado-bg:#2E1220; --cor-rejeitado-bg:#26123A;
  --cor-aguardando-bg:#3A2308; --cor-pendente-bg:#332A0B; --cor-atencao-bg:#0F2A4A; --cor-ok-bg:#0F2E1A; --cor-permanente-bg:#1B2730;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#04122A; --surface:#0B2B54; --surface-2:#0E3364;
    --border:#1B4276; --text:#EAF1FB; --text-muted:#9FB6D6;
    --header-bg:var(--azul-escuro); --header-text:#FFFFFF;
    --shadow:0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    --cor-vencido-bg:#3A1518; --cor-nao-iniciado-bg:#2E1220; --cor-rejeitado-bg:#26123A;
    --cor-aguardando-bg:#3A2308; --cor-pendente-bg:#332A0B; --cor-atencao-bg:#0F2A4A; --cor-ok-bg:#0F2E1A; --cor-permanente-bg:#1B2730;
    color-scheme: dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums lining-nums;
}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--azul-claro); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ---------- layout shell ---------- */
.app-header{
  position:sticky; top:0; z-index:40; background:var(--header-bg); color:var(--header-text);
  display:flex; align-items:center; gap:14px; padding:10px 20px; box-shadow:var(--shadow);
}
.logo-plate{
  background:#fff; border-radius:10px; padding:4px 10px; display:flex; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.25); flex:none; cursor:default; user-select:none;
}
.logo-plate img{display:block; height:34px; width:auto;}
.field-label{display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; margin:12px 0 4px;}
.field-input{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 8px; font-size:13px; font-family:inherit;}
.field-row{display:flex; gap:6px; align-items:center;}
.field-row .field-input{flex:1;}
.eye-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:6px; width:34px; height:32px; flex:none; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.cfg-status{font-size:12px; margin-top:8px; min-height:16px;}
.app-title{display:flex; flex-direction:column; line-height:1.15; margin-right:auto; min-width:0;}
.app-title strong{font-family:var(--font-display); font-size:17px; letter-spacing:.2px;}
.app-title span{font-size:11.5px; opacity:.85; font-weight:400;}
.header-actions{display:flex; align-items:center; gap:6px; flex:none;}
.icon-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
  color:var(--header-text); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s,transform .1s;
  position:relative;
}
.icon-btn:hover{background:rgba(255,255,255,.22);}
.icon-btn:active{transform:scale(.93);}
.icon-btn svg{width:18px; height:18px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#8BC34A;position:absolute;top:2px;right:2px;box-shadow:0 0 0 2px var(--header-bg);}
.sync-dot.off{background:#9AA6B2;}
.sync-dot.busy{background:#F9A825; animation:pulse 1s infinite;}
.sync-dot.err{background:#E53935;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- tooltip (data-tip) ---------- */
[data-tip]{position:relative;}
[data-tip]::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(4px);
  background:#111826; color:#fff; font-size:11.5px; font-weight:400; padding:5px 9px; border-radius:6px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .12s, transform .12s; z-index:80; box-shadow:0 4px 14px rgba(0,0,0,.3);
}
[data-tip]::before{
  content:''; position:absolute; bottom:calc(100% + 3px); left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#111826;
  opacity:0; transition:opacity .12s; pointer-events:none; z-index:80;
}
[data-tip]:hover::after,[data-tip]:focus-visible::after,[data-tip]:hover::before,[data-tip]:focus-visible::before{opacity:1; transform:translateX(-50%) translateY(0);}
[data-tip-below]::after{bottom:auto; top:calc(100% + 8px);}
[data-tip-below]::before{bottom:auto; top:calc(100% + 3px); border-top-color:transparent; border-bottom-color:#111826;}

/* ---------- KPI strip ---------- */
.kpi-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; padding:14px 20px; max-width:1440px; margin:0 auto;}
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer;
  text-align:left; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s;
  border-left:4px solid var(--kpi-color, var(--cinza-escuro));
}
.kpi-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.kpi-card.active{outline:2px solid var(--kpi-color); outline-offset:-2px;}
.kpi-card .n{font-family:var(--font-display); font-size:24px; color:var(--kpi-color);}
.kpi-card .l{font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}

/* ---------- filter bar ---------- */
.filter-bar{
  max-width:1440px; margin:0 auto; padding:0 20px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
.filter-bar input[type="search"], .filter-bar select{
  background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
  padding:8px 10px; font-size:13px; height:36px;
}
.filter-bar input[type="search"]{min-width:200px; flex:1 1 200px;}
.filter-bar .spacer{flex:1 1 auto;}
.seg{display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;}
.seg button{
  background:var(--surface); color:var(--text-muted); border:none; padding:0 12px; height:36px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px;
}
.seg button.active{background:var(--azul-royal); color:#fff;}
.pill-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); height:36px; padding:0 12px;
  display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;
}
.pill-btn:hover{border-color:var(--azul-royal);}
.pill-btn.has-value{border-color:var(--azul-royal); color:var(--azul-royal); font-weight:700;}

/* ---------- main / cards ---------- */
main{max-width:1440px; margin:0 auto; padding:0 20px 40px;}
.cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:12px;}
.branch-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:8px; transition:transform .12s, box-shadow .12s; box-shadow:var(--shadow);
}
.branch-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--azul-claro);}
.branch-card .bc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.branch-card .bc-sigla{font-family:var(--font-display); font-size:16px;}
.branch-card .bc-nome{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px;}
.branch-card .bc-tag{font-size:10.5px; color:var(--text-muted); background:var(--surface-2); border-radius:20px; padding:2px 8px; white-space:nowrap;}
.health-bar{display:flex; height:9px; border-radius:5px; overflow:hidden; background:var(--surface-2);}
.health-bar span{height:100%;}
.bc-summary{font-size:12px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:5px 10px;}
.bc-summary b{color:var(--text); font-weight:700;}
.bc-empty-note{font-size:11px; color:var(--text-muted); font-style:italic;}

/* ---------- status badge & dias chip ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  color:var(--c); background:var(--cbg); border:1px solid color-mix(in srgb, var(--c) 35%, transparent);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--c);}
.dias-chip{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; color:var(--c); background:var(--cbg); white-space:nowrap;}

/* ---------- table ---------- */
.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow);}
table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:820px;}
table.data-table th{
  position:sticky; top:0; background:var(--surface-2); text-align:left; padding:9px 10px; font-size:11px; text-transform:uppercase;
  letter-spacing:.3px; color:var(--text-muted); cursor:pointer; user-select:none; white-space:nowrap; border-bottom:1px solid var(--border);
}
table.data-table th:hover{color:var(--azul-royal);}
table.data-table th .arrow{opacity:.35; margin-left:3px;}
table.data-table th.sorted .arrow{opacity:1; color:var(--azul-royal);}
table.data-table td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
table.data-table tbody tr:hover{background:var(--surface-2);}
table.data-table tbody tr:last-child td{border-bottom:none;}
.row-doc-name{display:flex; align-items:center; gap:6px;}
.req-star{color:var(--azul-royal); font-size:13px;}
.edit-cell{cursor:pointer; border-radius:6px; padding:4px 6px; margin:-4px -6px;}
.edit-cell:hover{background:var(--surface-2); outline:1px dashed var(--border);}
.justif-text{color:var(--text-muted); font-size:11.5px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}

/* ---------- modal & popover ---------- */
.overlay{position:fixed; inset:0; background:rgba(5,12,25,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.overlay[hidden]{display:none;}
.modal{background:var(--surface); border-radius:var(--radius); width:100%; max-width:980px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); overflow:hidden;}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); background:var(--surface-2);}
.modal-head h2{font-family:var(--font-display); font-size:18px; margin:0;}
.modal-head .meta{font-size:12px; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:5px;}
.modal-body{padding:16px 18px; overflow:auto;}
.close-x{background:transparent; border:none; color:var(--text-muted); cursor:pointer; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
.close-x:hover{background:var(--border); color:var(--text);}

.popover{position:fixed; z-index:120; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); width:300px; padding:14px;}
.popover[hidden]{display:none;}
.popover h3{margin:0 0 10px; font-size:13px; font-family:var(--font-display);}
.popover label{display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; margin:10px 0 4px;}
.popover select, .popover input[type="date"], .popover textarea, .popover input[type="text"]{
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 8px; font-size:13px; font-family:inherit;
}
.popover textarea{resize:vertical; min-height:56px;}
.popover .pop-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
.btn{border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;}
.btn-primary{background:var(--azul-royal); color:#fff;}
.btn-primary:hover{background:var(--azul-escuro);}
.btn-ghost{background:transparent; color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2); color:var(--text);}

/* ---------- hide-branches panel ---------- */
.hide-panel{position:fixed; z-index:120; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); width:280px; max-height:360px; display:flex; flex-direction:column;}
.hide-panel[hidden]{display:none;}
.hide-panel .hp-head{padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.hide-panel .hp-list{overflow:auto; padding:6px 8px;}
.hide-panel label{display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:12.5px; border-radius:6px; cursor:pointer;}
.hide-panel label:hover{background:var(--surface-2);}

/* ---------- toast ---------- */
.toast-wrap{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:#111826; color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.3); opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s;}
.toast.show{opacity:1; transform:translateY(0);}

.empty-state{text-align:center; padding:60px 20px; color:var(--text-muted);}
.empty-state svg{width:40px; height:40px; margin-bottom:10px; opacity:.5;}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .kpi-strip{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:640px){
  .kpi-strip{grid-template-columns:repeat(2,1fr); padding:10px;}
  .filter-bar{padding:0 10px 10px;}
  main{padding:0 10px 30px;}
  .app-header{padding:8px 12px;}
  .app-title span{display:none;}
  table.data-table{min-width:680px;}
}
</style>
</head>

/* ================= utils ================= */
function norm(s){
  return String(s||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function parseISO(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function diffDays(a,b){ const MS=86400000; return Math.round((a - b)/MS); }
function fmtDateBR(iso){ if(!iso) return '—'; const d=parseISO(iso); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
function todayD(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  get(k,fallback){ try{ const v=window.localStorage.getItem(k); return v===null?fallback:JSON.parse(v);}catch(e){ return (k in this.mem)?this.mem[k]:fallback; } },
  set(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ this.mem[k]=v; } }
};

function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  if(kind==='err') el.style.background = '#7A1F2B';
  wrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); }, 2600);
}

/* ================= derive ================= */
function getOverride(regId){ return overrides[regId] || null; }

function computeUrgencia(status, dataVenc, diasAntes, hoje){
  if(status==='Não Iniciado') return 'nao_iniciado';
  if(status==='Rejeitado') return 'rejeitado';
  if(status==='Aguardando Aprovação') return 'aguardando';
  if(status==='Aberto/Pendente') return 'pendente';
  if(!dataVenc) return 'permanente';
  const d = parseISO(dataVenc);
  const dias = diffDays(d, hoje);
  if(dias < 0) return 'vencido';
  if(diasAntes != null){
    const inicioJanela = addDays(d, -diasAntes);
    if(hoje >= inicioJanela) return 'atencao';
  }
  return 'ok';
}

function deriveRegistro(reg, hoje){
  const ov = getOverride(reg.id);
  const status = ov && ov.status != null ? ov.status : reg.status;
  const dataVencimento = ov && ov.dataVencimento !== undefined ? ov.dataVencimento : reg.dataVencimento;
  const justificativa = ov && ov.justificativa != null ? ov.justificativa : reg.justificativa;
  const cat = catalogByKey[reg.docKey];
  const urgencia = computeUrgencia(status, dataVencimento, cat.diasAntes, hoje);
  let diasParaVencer = null;
  if(dataVencimento){ diasParaVencer = diffDays(parseISO(dataVencimento), hoje); }
  return {
    ...reg, status, dataVencimento, justificativa, urgencia, diasParaVencer,
    diasAntes: cat.diasAntes, observacao: cat.observacao,
    updatedBy: ov ? ov.updatedBy : null, updatedAt: ov ? ov.updatedAt : null,
    branch: branchesById[reg.filialId],
  };
}

function allDerived(){
  const hoje = todayD();
  return DADOS.registros.map(r=> deriveRegistro(r, hoje));
}

/* ================= filtering ================= */
function matchesDropdowns(d){
  const b = d.branch;
  if(state.regional && b.regional !== state.regional) return false;
  if(state.auditor && b.auditor !== state.auditor) return false;
  if(state.regiao && b.regiao !== state.regiao) return false;
  if(state.estado && b.estado !== state.estado) return false;
  if(state.hiddenFiliais.has(b.id)) return false;
  return true;
}
function matchesSearch(d){
  if(!state.search) return true;
  const q = norm(state.search);
  return norm(d.branch.sigla).includes(q) || norm(d.branch.nome).includes(q) || norm(d.docNome).includes(q);
}
function getVisibleDerived(){
  return allDerived().filter(d=> matchesDropdowns(d) && matchesSearch(d));
}
function getFilteredDerived(){
  let list = getVisibleDerived();
  if(state.kpiFilter) list = list.filter(d=> d.urgencia === state.kpiFilter);
  return list;
}

function healthBarHTML(list){
  const total = list.length || 1;
  const order = ['vencido','nao_iniciado','rejeitado','aguardando','pendente','atencao','ok','permanente'];
  const counts = {}; order.forEach(k=>counts[k]=0);
  list.forEach(d=> counts[d.urgencia]++);
  return `<div class="health-bar">` + order.filter(k=>counts[k]>0).map(k=>{
    const pct = (counts[k]/total*100).toFixed(2);
    return `<span style="width:${pct}%;background:${URGENCY_META[k].color}" data-tip="${counts[k]} ${escapeHtml(URGENCY_META[k].label)}"></span>`;
  }).join('') + `</div>`;
}
function summaryLineHTML(list){
  const order = ['vencido','nao_iniciado','rejeitado','aguardando','pendente','atencao'];
  const counts={}; list.forEach(d=>counts[d.urgencia]=(counts[d.urgencia]||0)+1);
  const parts = order.filter(k=>counts[k]).map(k=> `<span><b>${counts[k]}</b> ${escapeHtml(URGENCY_META[k].label.toLowerCase())}</span>`);
  const okCount = (counts.ok||0)+(counts.permanente||0);
  if(parts.length===0) return `<div class="bc-summary"><span><b>${okCount}</b> em dia</span></div>`;
  if(okCount) parts.push(`<span><b>${okCount}</b> em dia</span>`);
  return `<div class="bc-summary">${parts.join('')}</div>`;
}
function renderCards(list){
  const byBranch = {};
  list.forEach(d=>{ (byBranch[d.filialId] ||= []).push(d); });
  const ids = Object.keys(byBranch).map(Number).sort((a,b)=>{
    const worst = arr => Math.min(...arr.map(d=>URGENCY_META[d.urgencia].order));
    return worst(byBranch[a]) - worst(byBranch[b]) || a-b;
  });
  const el = document.getElementById('cardsView');
  if(ids.length===0){ el.innerHTML = emptyStateHTML(); return; }
  el.innerHTML = ids.map(id=>{
    const b = branchesById[id]; const items = byBranch[id];
    return `<button class="branch-card" data-branch="${id}">
      <div class="bc-top">
        <div><div class="bc-sigla">${escapeHtml(b.sigla)}</div><div class="bc-nome">${escapeHtml(b.nome||'')}</div></div>
        ${b.regiao? `<span class="bc-tag">${escapeHtml(b.regiao)}</span>`:''}
      </div>
      ${healthBarHTML(items)}
      ${summaryLineHTML(items)}
    </button>`;
  }).join('');
  el.querySelectorAll('[data-branch]').forEach(card=>{
    card.addEventListener('click', ()=> openBranchModal(Number(card.getAttribute('data-branch'))));
  });
}

      case 'urgencia': av=URGENCY_META[a.urgencia].order; bv=URGENCY_META[b.urgencia].order; break;
      case 'dataVencimento': av=a.dataVencimento||'9999'; bv=b.dataVencimento||'9999'; break;
      case 'diasParaVencer': av=a.diasParaVencer==null?999999:a.diasParaVencer; bv=b.diasParaVencer==null?999999:b.diasParaVencer; break;
      case 'regional': av=a.branch.regional||''; bv=b.branch.regional||''; break;
      case 'justificativa': av=a.justificativa||''; bv=b.justificativa||''; break;
      default: av=0; bv=0;
    }
    if(av<bv) return -1*mul; if(av>bv) return 1*mul; return 0;
  });
  return arr;
}
function diasChipHTML(d){
  if(d.diasParaVencer==null) return `<span class="dias-chip" style="--c:var(--cor-permanente)">—</span>`;
  const n = d.diasParaVencer;
  const txt = n<0 ? `${Math.abs(n)}d atrás` : (n===0? 'hoje' : `em ${n}d`);
  const color = URGENCY_META[d.urgencia].color;
  return `<span class="dias-chip" style="--c:${color}">${txt}</span>`;
}
function statusBadgeHTML(d){
  const m = URGENCY_META[d.urgencia];
  return `<span class="badge" style="--c:${m.color};--cbg:${m.bg}"><span class="dot"></span>${escapeHtml(d.status)}</span>`;
}
function renderTable(list){
  const sorted = sortDerived(list);
  const el = document.getElementById('tableView');
  if(sorted.length===0){ el.innerHTML = emptyStateHTML(); return; }
  const rows = sorted.map(d=> `<tr data-reg="${d.id}">
      <td>${escapeHtml(d.branch.sigla)}</td>
      <td><span class="row-doc-name">${d.obrigatorio?'<span class="req-star" data-tip="Obrigatória">★</span>':''}${escapeHtml(d.docNome)}</span></td>
      <td class="edit-cell" data-edit="${d.id}">${statusBadgeHTML(d)}</td>
      <td>${escapeHtml(fmtDateBR(d.dataVencimento))}</td>
      <td>${diasChipHTML(d)}</td>
      <td>${escapeHtml(d.branch.regional||'—')}</td>
      <td class="edit-cell" data-edit="${d.id}"><span class="justif-text" data-tip="${escapeHtml(d.justificativa||'Clique para adicionar')}">${escapeHtml(d.justificativa||'—')}</span></td>
    </tr>`).join('');
  el.innerHTML = `<table class="data-table"><thead><tr>${TABLE_COLS.map(c=>{
      const sorted_ = state.sort.col===c.key;
      return `<th data-col="${c.key}" class="${sorted_?'sorted':''}" tabindex="0" role="button" aria-label="Ordenar por ${escapeHtml(c.label)}">${escapeHtml(c.label)}<span class="arrow">${sorted_?(state.sort.dir==='asc'?'▲':'▼'):'▲'}</span></th>`;
    }).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('th[data-col]').forEach(th=>{
    const doSort = ()=>{
      const col = th.getAttribute('data-col');
      if(state.sort.col===col) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
      else state.sort = {col, dir:'asc'};
      renderTable(getFilteredDerived());
    };
    th.addEventListener('click', doSort);
    th.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); doSort(); } });
  });
  el.querySelectorAll('[data-edit]').forEach(cell=>{
    cell.addEventListener('click', (e)=> openEditPopover(Number(cell.getAttribute('data-edit')), cell));
  });
}

/* ================= branch modal ================= */

  const meta = [
    b.regional && `Regional: <b>${escapeHtml(b.regional)}</b>`,
    b.auditor && `Auditor: <b>${escapeHtml(b.auditor)}</b>`,
    b.coordenador && `Coordenador: <b>${escapeHtml(b.coordenador)}</b>`,
    b.estado && `Estado: <b>${escapeHtml(b.estado)}</b>`,
    b.gerente && `Gerente: <b>${escapeHtml(b.gerente)}</b>`,
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');
  const rows = sorted.map(d=> `<tr data-reg="${d.id}">
      <td><span class="row-doc-name">${d.obrigatorio?'<span class="req-star" data-tip="Obrigatória">★</span>':''}${escapeHtml(d.docNome)}</span></td>
      <td class="edit-cell" data-edit="${d.id}">${statusBadgeHTML(d)}</td>
      <td>${escapeHtml(fmtDateBR(d.dataVencimento))}</td>
      <td>${diasChipHTML(d)}</td>
      <td class="edit-cell" data-edit="${d.id}"><span class="justif-text" data-tip="${escapeHtml(d.justificativa||'Clique para adicionar')}">${escapeHtml(d.justificativa||'—')}</span></td>
    </tr>`).join('');
  document.getElementById('branchModal').innerHTML = `
    <div class="modal-head">
      <div><h2>${escapeHtml(b.sigla)} — ${escapeHtml(b.nome||'')}</h2><div class="meta">${meta}</div></div>
      <button class="close-x" id="modalCloseBtn" aria-label="Fechar" data-tip="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="modal-body">
      ${healthBarHTML(items)}
      <div style="height:12px"></div>
      <div class="table-wrap"><table class="data-table"><thead><tr>
        <th>Documento</th><th>Status</th><th>Vencimento</th><th>Dias</th><th>Justificativa</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  document.getElementById('branchModal').querySelectorAll('[data-edit]').forEach(cell=>{
    cell.addEventListener('click', ()=> openEditPopover(Number(cell.getAttribute('data-edit')), cell));
  });
  document.getElementById('modalCloseBtn').addEventListener('click', closeBranchModal);
  document.getElementById('branchOverlay').hidden = false;
}
function closeBranchModal(){ document.getElementById('branchOverlay').hidden = true; }

/* ================= edit popover ================= */
function openEditPopover(regId, anchorEl){
  const hoje = todayD();
  const base = DADOS.registros.find(r=>r.id===regId);
  const d = deriveRegistro(base, hoje);
  const pop = document.getElementById('editPopover');
  pop.innerHTML = `
    <h3>${escapeHtml(d.branch.sigla)} · ${escapeHtml(d.docNome)}</h3>
    <label for="popStatus">Status</label>
    <select id="popStatus">${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===d.status?'selected':''}>${s}</option>`).join('')}</select>
    <label for="popData">Data de vencimento</label>
    <input type="date" id="popData" value="${d.dataVencimento||''}">
    <label for="popJust">Justificativa</label>
    <textarea id="popJust" placeholder="Ex.: protocolo aberto na prefeitura em .../.../...">${escapeHtml(d.justificativa||'')}</textarea>
    <label for="popNome">Seu nome (opcional)</label>
    <input type="text" id="popNome" placeholder="Quem está atualizando" value="${escapeHtml(safeStorage.get('painelLic_userName',''))}">
    ${d.updatedAt? `<div style="font-size:10.5px;color:var(--text-muted);margin-top:6px">Última edição: ${escapeHtml(d.updatedBy||'—')} em ${fmtDateBR(d.updatedAt)}</div>`:''}
    <div class="pop-actions">
      <button class="btn btn-ghost" id="popCancel">Cancelar</button>
      <button class="btn btn-primary" id="popSave">Salvar</button>
    </div>`;
  positionPopover(pop, anchorEl);
  pop.hidden = false;
  document.getElementById('popCancel').addEventListener('click', closeEditPopover);
  document.getElementById('popSave').addEventListener('click', ()=> saveEdit(regId));
  setTimeout(()=> document.addEventListener('mousedown', outsidePopoverListener), 0);
}
function positionPopover(pop, anchorEl){
  const r = anchorEl.getBoundingClientRect();
  const w = 300, pad=10;
  let left = r.left;
  if(left + w + pad > window.innerWidth) left = window.innerWidth - w - pad;
  let top = r.bottom + 8;
  pop.style.left = Math.max(pad,left)+'px';
  if(top + 320 > window.innerHeight) top = Math.max(pad, r.top - 8 - 320);
  pop.style.top = top+'px';
}
function outsidePopoverListener(e){
  const pop = document.getElementById('editPopover');
  if(pop.hidden) return;
  if(!pop.contains(e.target)) closeEditPopover();
}
function closeEditPopover(){
  document.getElementById('editPopover').hidden = true;
  document.removeEventListener('mousedown', outsidePopoverListener);
}
function saveEdit(regId){
  const status = document.getElementById('popStatus').value;
  const dataVencimento = document.getElementById('popData').value || null;
  const justificativa = document.getElementById('popJust').value;
  const nome = document.getElementById('popNome').value.trim();
  if(nome) safeStorage.set('painelLic_userName', nome);
  overrides[regId] = { status, dataVencimento, justificativa, updatedBy: nome||null, updatedAt: toISO(new Date()) };
  closeEditPopover();
  renderAll();
  queueSync();
  toast('Salvo');
}

/* ================= hide branches panel ================= */
function renderHidePanel(){
  const panel = document.getElementById('hidePanel');
  const list = [...DADOS.filiais].sort((a,b)=> a.sigla.localeCompare(b.sigla));
  panel.innerHTML = `<div class="hp-head"><span>Ocultar filiais</span><button class="btn btn-ghost" id="hideClearBtn" style="padding:4px 8px;font-size:11px">Limpar</button></div>
    <div class="hp-list">${list.map(b=> `<label><input type="checkbox" data-hide="${b.id}" ${state.hiddenFiliais.has(b.id)?'checked':''}> ${escapeHtml(b.sigla)} — ${escapeHtml(b.nome||'')}</label>`).join('')}</div>`;
  panel.querySelectorAll('[data-hide]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = Number(cb.getAttribute('data-hide'));
      if(cb.checked) state.hiddenFiliais.add(id); else state.hiddenFiliais.delete(id);
      safeStorage.set('painelLic_hidden', [...state.hiddenFiliais]);
      updateHideLabel();
      renderAll();
    });
  });
  document.getElementById('hideClearBtn').addEventListener('click', ()=>{
    state.hiddenFiliais.clear();
    safeStorage.set('painelLic_hidden', []);
    updateHideLabel(); renderHidePanel(); renderAll();
  });
}
function updateHideLabel(){
  const n = state.hiddenFiliais.size;
  document.getElementById('hideLabel').textContent = n? `Ocultas (${n})` : 'Ocultar filiais';
  document.getElementById('hideBtn').classList.toggle('has-value', n>0);
}

/* ================= config efetiva (override local > padrão embutido) ================= */
function getEffectiveConfig(){
  const ov = safeStorage.get('painelLic_configOverride', null);
  if(ov && ov.binId && ov.apiKey) return { binId: ov.binId, apiKey: ov.apiKey };
  return { binId: CONFIG.JSONBIN_BIN_ID, apiKey: CONFIG.JSONBIN_API_KEY };
}

/* ================= sync (JSONBin) ================= */
function setSyncDot(kind){
  syncStatus = kind;
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (kind==='ok'?'':kind);
  const label = document.getElementById('lastSyncLabel');
  const texts = {
    off: 'Modo local — sincronização ainda não configurada',
    busy: 'Sincronizando…',
    ok: 'Sincronizado às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    err: 'Falha ao sincronizar — alterações salvas só neste navegador',
  };
  label.textContent = texts[kind] || texts.off;
  document.getElementById('syncBtn').setAttribute('data-tip', kind==='off' ? 'Sincronização não configurada' : 'Sincronizar agora');
}
async function loadOverrides(){
  const cfg = getEffectiveConfig();
  if(!cfg.binId || !cfg.apiKey){ setSyncDot('off'); return; }
  setSyncDot('busy');
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE + cfg.binId + '/latest', {
      headers: { 'X-Master-Key': cfg.apiKey }
    });
    if(!res.ok) throw new Error('http '+res.status);
    const json = await res.json();
    overrides = (json && json.record && json.record.overrides) || {};
    setSyncDot('ok');
  }catch(e){ console.error('loadOverrides', e); setSyncDot('err'); }
}
async function pushOverrides(){
  const cfg = getEffectiveConfig();
  if(!cfg.binId || !cfg.apiKey){ setSyncDot('off'); return; }
  setSyncDot('busy');
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE + cfg.binId, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey },
      body: JSON.stringify({ overrides, updatedAt: new Date().toISOString() })
    });
    if(!res.ok) throw new Error('http '+res.status);
    setSyncDot('ok');
  }catch(e){ console.error('pushOverrides', e); setSyncDot('err'); toast('Falha ao sincronizar — suas alterações ficaram salvas neste navegador', 'err'); }
}
const queueSync = debounce(pushOverrides, 900);

/* ================= painel de configuração oculto (5 cliques na logo) ================= */
let logoClickTimes = [];
function handleLogoClick(){
  const now = Date.now();
  logoClickTimes = logoClickTimes.filter(t => now - t < 2000);
  logoClickTimes.push(now);
  if(logoClickTimes.length >= 5){
    logoClickTimes = [];
    openSettingsPanel();
  }
}
function openSettingsPanel(){
  const cfg = getEffectiveConfig();
  document.getElementById('cfgBinId').value = cfg.binId || '';
  document.getElementById('cfgApiKey').value = cfg.apiKey || '';
  document.getElementById('cfgApiKey').type = 'password';
  document.getElementById('cfgStatusMsg').textContent = '';
  document.getElementById('settingsOverlay').hidden = false;
}
function closeSettingsPanel(){ document.getElementById('settingsOverlay').hidden = true; }
function toggleKeyVisibility(){
  const inp = document.getElementById('cfgApiKey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
async function testConnection(){
  const binId = document.getElementById('cfgBinId').value.trim();
  const apiKey = document.getElementById('cfgApiKey').value.trim();
  const msg = document.getElementById('cfgStatusMsg');
  msg.style.color = 'var(--text-muted)'; msg.textContent = 'Testando…';
  if(!binId || !apiKey){ msg.style.color='var(--cor-vencido)'; msg.textContent='Preencha Bin ID e Master Key.'; return; }
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE + binId + '/latest', { headers:{ 'X-Master-Key': apiKey } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    await res.json();
    msg.style.color = 'var(--cor-ok)'; msg.textContent = 'Conexão OK.';
  }catch(e){ msg.style.color='var(--cor-vencido)'; msg.textContent = 'Falha: '+e.message; }
}
async function saveSettings(){
  const binId = document.getElementById('cfgBinId').value.trim();
  const apiKey = document.getElementById('cfgApiKey').value.trim();
  safeStorage.set('painelLic_configOverride', (binId && apiKey) ? {binId, apiKey} : null);
  closeSettingsPanel();
  await loadOverrides();
  renderAll();
  toast('Configuração salva neste navegador');
}
function restoreDefaultConfig(){
  safeStorage.set('painelLic_configOverride', null);
  const cfg = getEffectiveConfig();
  document.getElementById('cfgBinId').value = cfg.binId || '';
  document.getElementById('cfgApiKey').value = cfg.apiKey || '';
  document.getElementById('cfgStatusMsg').textContent = '';
  toast('Restaurado para o padrão do arquivo');
}
async function createBinAutomatically(){
  const apiKey = document.getElementById('cfgApiKey').value.trim();
  const msg = document.getElementById('cfgStatusMsg');
  if(!apiKey){ msg.style.color='var(--cor-vencido)'; msg.textContent='Preencha a Master Key primeiro.'; return; }
  msg.style.color = 'var(--text-muted)'; msg.textContent = 'Criando bin novo…';
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name':'Painel Licenças Agroquima' },
      body: JSON.stringify({ overrides:{} })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    const newId = json && json.metadata && json.metadata.id;
    if(!newId) throw new Error('resposta sem id');
    document.getElementById('cfgBinId').value = newId;
    safeStorage.set('painelLic_configOverride', {binId:newId, apiKey});
    await loadOverrides();
    renderAll();
    msg.style.color = 'var(--cor-ok)';
    msg.textContent = 'Bin criado e já configurado neste navegador! ID: ' + newId + ' — copie e envie pra deixar fixo pra todo mundo.';
  }catch(e){ msg.style.color='var(--cor-vencido)'; msg.textContent = 'Falha ao criar: '+e.message; }
}



/* ================= theme ================= */
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  const icon = document.getElementById('themeIcon');
  const btn = document.getElementById('themeBtn');
  const map = {
    auto:  {tip:'Tema: automático (segue o dispositivo)', path:'sun'},
    light: {tip:'Tema: claro', path:'sun'},
    dark:  {tip:'Tema: escuro', path:'moon'},
  };
  btn.setAttribute('data-tip', map[mode].tip);
  btn.setAttribute('aria-label', map[mode].tip);
  icon.innerHTML = map[mode].path==='moon'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
    : '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
}
function cycleTheme(){
  const cur = safeStorage.get('painelLic_theme','auto');
  const next = cur==='auto' ? 'light' : (cur==='light' ? 'dark' : 'auto');
  safeStorage.set('painelLic_theme', next);
  applyTheme(next);
}

/* ================= main render ================= */
function renderAll(){
  renderKPIs();
  const list = getFilteredDerived();
  if(state.view==='cards'){ renderCards(list); }
  else { renderTable(list); }
}
function setView(v){
  state.view = v; safeStorage.set('painelLic_view', v);
  document.getElementById('cardsView').hidden = v!=='cards';
  document.getElementById('tableView').hidden = v!=='table';
  document.getElementById('viewCardsBtn').classList.toggle('active', v==='cards');
  document.getElementById('viewTableBtn').classList.toggle('active', v==='table');
  renderAll();
}

/* ================= init ================= */
async function init(){
  populateDropdowns();
  applyTheme(safeStorage.get('painelLic_theme','auto'));
  updateHideLabel();
  setView(state.view);

  document.getElementById('searchInput').addEventListener('input', debounce((e)=>{ state.search=e.target.value; renderAll(); }, 180));
  ['Regional','Auditor','Regiao','Estado'].forEach(name=>{
    document.getElementById('filter'+name).addEventListener('change', (e)=>{
      state[name.toLowerCase()] = e.target.value; renderAll();
    });
  });
  document.getElementById('viewCardsBtn').addEventListener('click', ()=> setView('cards'));
  document.getElementById('viewTableBtn').addEventListener('click', ()=> setView('table'));
  document.getElementById('themeBtn').addEventListener('click', cycleTheme);
  document.getElementById('syncBtn').addEventListener('click', async ()=>{ await loadOverrides(); renderAll(); toast('Sincronizado'); });
  document.getElementById('branchOverlay').addEventListener('mousedown', (e)=>{ if(e.target.id==='branchOverlay') closeBranchModal(); });
  document.getElementById('logoPlate').addEventListener('click', handleLogoClick);
  document.getElementById('settingsOverlay').addEventListener('mousedown', (e)=>{ if(e.target.id==='settingsOverlay') closeSettingsPanel(); });
  document.getElementById('settingsCloseBtn').addEventListener('click', closeSettingsPanel);
  document.getElementById('cfgToggleKey').addEventListener('click', toggleKeyVisibility);
  document.getElementById('cfgTestBtn').addEventListener('click', testConnection);
  document.getElementById('cfgAutoCreateBtn').addEventListener('click', createBinAutomatically);
  document.getElementById('cfgSaveBtn').addEventListener('click', saveSettings);
  document.getElementById('cfgRestoreBtn').addEventListener('click', restoreDefaultConfig);
  document.getElementById('hideBtn').addEventListener('click', (e)=>{
    const panel = document.getElementById('hidePanel');
    if(panel.hidden){
      renderHidePanel();
      const r = e.currentTarget.getBoundingClientRect();
      panel.style.left = r.left+'px'; panel.style.top = (r.bottom+8)+'px';
      panel.hidden = false;
      setTimeout(()=> document.addEventListener('mousedown', outsideHidePanelListener), 0);
    } else { panel.hidden = true; }
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ closeBranchModal(); closeEditPopover(); closeSettingsPanel(); document.getElementById('hidePanel').hidden=true; }
  });

  await loadOverrides();
  renderAll();
}
function outsideHidePanelListener(e){
  const panel = document.getElementById('hidePanel');
  const btn = document.getElementById('hideBtn');
  if(panel.hidden) return;
  if(!panel.contains(e.target) && e.target!==btn && !btn.contains(e.target)){
    panel.hidden = true;
    document.removeEventListener('mousedown', outsideHidePanelListener);
  }
}

init();

</script>
